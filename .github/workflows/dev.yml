name: Build development package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ptr
      - beta
      - alpha
    tags-ignore:
      - '**'

permissions:
  contents: read

jobs:
  package:
    name: Build installable ZIP
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workaround checkout issues
        run: |
          git fetch --tags --force
      - name: Create Package
        uses: BigWigsMods/packager@v2
        with:
          args: -d -n "{package-name}-$GITHUB_REF_NAME-{project-version}"
      - name: Save package for download
        uses: actions/upload-artifact@v7
        with:
          path: .release/*.zip
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
